<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - 303-XMD</title>
  <style>
    body { background: #0a0a0f; color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .auth-box { background: rgba(20, 20, 30, 0.8); padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); }
    input { width: 100%; padding: 12px; margin: 10px 0; background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #6366f1; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    .toggle { text-align: center; margin-top: 15px; font-size: 14px; color: #8b8ba8; cursor: pointer; }
  </style>
</head>
<body>
  <div class="auth-box">
    <h2 id="title" style="text-align:center;">Login</h2>
    <input type="email" id="email" placeholder="Email (Admin Email for Admin access)">
    <input type="password" id="password" placeholder="Password">
    <button onclick="submitAuth()" id="btn">Login</button>
    <div class="toggle" onclick="toggleMode()" id="toggleText">Don't have an account? Register</div>
  </div>

  <script>
    let isLogin = true;

    function toggleMode() {
      isLogin = !isLogin;
      document.getElementById("title").innerText = isLogin ? "Login" : "Register";
      document.getElementById("btn").innerText = isLogin ? "Login" : "Register";
      document.getElementById("toggleText").innerText = isLogin ? "Don't have an account? Register" : "Already have an account? Login";
    }

    async function submitAuth() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const endpoint = isLogin ? "/api/login" : "/api/register";

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.error) throw new Error(data.error);

        if (isLogin) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("role", data.role);
          window.location.href = "/dashboard.html";
        } else {
          alert("Registered successfully! Please login.");
          toggleMode();
        }
      } catch (err) {
        alert(err.message);
      }
    }
  </script>
</body>
</html>
