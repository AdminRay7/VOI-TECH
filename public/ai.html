<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>303-XMD — AI Control</title>
  <link rel="stylesheet" href="/sidebar.css">
  <style>
    body { padding-top: 90px !important; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 30px; backdrop-filter: blur(10px); }
    
    .chat-box { height: 350px; overflow-y: auto; background: rgba(0,0,0,0.4); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; border: 1px solid var(--border); }
    .msg { max-width: 75%; padding: 12px 18px; border-radius: 12px; font-size: 15px; line-height: 1.5; }
    .msg.user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.ai { background: rgba(255,255,255,0.1); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px; }
    
    .chat-input-row { display: flex; gap: 15px; }
    .chat-input-row input { flex: 1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🤖 AI Assistant Test</h1>
      <p style="color:var(--text-muted); margin-bottom: 20px;">Test the Groq AI model before deploying it to WhatsApp.</p>
      <div class="chat-box" id="chatBox">
        <div class="msg ai">Hello! I am the 303-XMD AI. How can I help you today?</div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendMessage()" />
        <button id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script src="/sidebar.js"></script>
  <script>
    async function sendMessage() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text) return;
      
      const chatBox = document.getElementById("chatBox");
      chatBox.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = ""; chatBox.scrollTop = chatBox.scrollHeight;

      const loadingId = "load-" + Date.now();
      chatBox.innerHTML += `<div class="msg ai" id="${loadingId}">Typing...</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch("/api/ai/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${localStorage.getItem("token")}` },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        document.getElementById(loadingId).remove();
        chatBox.innerHTML += `<div class="msg ai">${data.reply || "Error: " + data.error}</div>`;
      } catch (e) {
        document.getElementById(loadingId).remove();
        chatBox.innerHTML += `<div class="msg ai" style="color:var(--error)">Failed to connect to AI.</div>`;
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
