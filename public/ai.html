<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>303-XMD — AI Control</title>
  
  <!-- Universal Sidebar CSS -->
  <link rel="stylesheet" href="/sidebar.css">
  
  <style>
    :root {
      --bg-main: #0a0a0f;
      --bg-panel: rgba(20, 20, 30, 0.6);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #e6e6f0;
      --text-muted: #8b8ba8;
      --border: rgba(255, 255, 255, 0.08);
      --success: #4ade80;
      --error: #f87171;
    }

    body { 
      background-color: var(--bg-main); 
      background-image: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 40%);
      color: var(--text-main); 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      padding: 20px; 
    }

    .container { 
      max-width: 800px; 
      margin: 30px auto; 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
    }
    
    .card { 
      background: var(--bg-panel); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 30px; 
      backdrop-filter: blur(10px); 
    }
    
    h1 { font-size: 22px; margin-bottom: 5px; }
    p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }

    /* Toggle Switch */
    .toggle-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 15px 0; 
      border-top: 1px solid rgba(255,255,255,0.05); 
      border-bottom: 1px solid rgba(255,255,255,0.05); 
    }
    .toggle-label { font-size: 16px; font-weight: 500; }
    .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--success); }
    input:checked + .slider:before { transform: translateX(22px); }

    .status-text {
      margin-top: 15px; 
      font-size: 13px; 
      font-weight: 600;
      color: var(--success);
    }

    /* Web Chat */
    .chat-box { 
      height: 300px; 
      overflow-y: auto; 
      background: #050508; 
      border-radius: 8px; 
      padding: 15px; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      margin-bottom: 15px; 
      border: 1px solid var(--border); 
    }
    
    .msg { 
      max-width: 80%; 
      padding: 10px 15px; 
      border-radius: 8px; 
      font-size: 14px; 
      line-height: 1.5; 
      word-wrap: break-word;
    }
    
    .msg.user { 
      background: var(--primary); 
      color: white; 
      align-self: flex-end; 
      border-bottom-right-radius: 0; 
    }
    
    .msg.ai { 
      background: rgba(255,255,255,0.1); 
      color: var(--text-main); 
      align-self: flex-start; 
      border-bottom-left-radius: 0; 
    }
    
    .chat-input-row { display: flex; gap: 10px; }
    .chat-input-row input { 
      flex: 1; 
      padding: 14px; 
      border-radius: 8px; 
      border: 1px solid var(--border); 
      background: rgba(0,0,0,0.3); 
      color: white; 
      outline: none; 
      font-size: 15px;
    }
    .chat-input-row input:focus { border-color: var(--primary); }
    
    .chat-input-row button { 
      padding: 0 24px; 
      border-radius: 8px; 
      background: var(--primary); 
      color: white; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      transition: 0.2s;
    }
    .chat-input-row button:hover { background: var(--primary-hover); }
    .chat-input-row button:disabled { background: #3730a3; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="container">
    <!-- AI Toggle Card -->
    <div class="card">
      <h1>🤖 AI Auto-Reply Control</h1>
      <p>Turn the automatic AI replies on or off for WhatsApp groups and DMs.</p>
      
      <div class="toggle-row">
        <span class="toggle-label">Auto-Reply Status</span>
        <label class="switch">
          <input type="checkbox" id="aiToggle" onchange="toggleAI(this.checked)">
          <span class="slider"></span>
        </label>
      </div>
      <div class="status-text" id="statusText">Checking status...</div>
    </div>

    <!-- Web Chat Card -->
    <div class="card">
      <h1>💬 Test AI (Web)</h1>
      <p>Chat with the AI directly here without using WhatsApp.</p>

      <div class="chat-box" id="chatBox">
        <div class="msg ai">Hello! I am the 303-XMD AI. How can I help you today?</div>
      </div>

      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)" />
        <button id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Sidebar JS -->
  <script src="/sidebar.js"></script>
  
  <script>
    // Check initial status on load
    async function checkAIStatus() {
      try {
        const res = await fetch("/health");
        const data = await res.json();
        // Assuming the backend returns the state in the health check
        // If not, we default to true (on)
        const isEnabled = data.aiEnabled !== undefined ? data.aiEnabled : true; 
        
        document.getElementById("aiToggle").checked = isEnabled;
        updateStatusText(isEnabled);
      } catch (e) {
        updateStatusText(true); // default fallback
      }
    }

    function updateStatusText(isEnabled) {
      const statusText = document.getElementById("statusText");
      if (isEnabled) {
        statusText.innerHTML = "✅ AI is currently ON and replying to WhatsApp messages.";
        statusText.style.color = "var(--success)";
      } else {
        statusText.innerHTML = "❌ AI is currently OFF and will ignore messages.";
        statusText.style.color = "var(--error)";
      }
    }

    // Toggle AI State
    async function toggleAI(isEnabled) {
      try {
        const res = await fetch("/api/ai/toggle", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: isEnabled })
        });
        const data = await res.json();
        
        if (data.success) {
          updateStatusText(data.enabled);
        }
      } catch (e) {
        alert("Failed to toggle AI. Check server logs.");
        document.getElementById("aiToggle").checked = !isEnabled; // revert UI
      }
    }

    // Web Chat Logic
    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById("chatInput");
      const btn = document.getElementById("sendBtn");
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById("chatBox");
      
      // Add user message
      chatBox.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = "";
      btn.disabled = true;
      chatBox.scrollTop = chatBox.scrollHeight;

      // Add typing indicator
      const loadingId = "load-" + Date.now();
      chatBox.innerHTML += `<div class="msg ai" id="${loadingId}">Typing...</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch("/api/ai/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        
        document.getElementById(loadingId).remove();
        
        if (data.reply) {
          chatBox.innerHTML += `<div class="msg ai">${data.reply}</div>`;
        } else {
          chatBox.innerHTML += `<div class="msg ai" style="color:var(--error)">Error: ${data.error}</div>`;
        }
      } catch (e) {
        document.getElementById(loadingId).remove();
        chatBox.innerHTML += `<div class="msg ai" style="color:var(--error)">Failed to connect to server.</div>`;
      }
      
      btn.disabled = false;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Initialize
    checkAIStatus();
  </script>
</body>
</html>
