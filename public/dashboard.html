<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>303-XMD — Dashboard</title>
  
  <!-- Universal Sidebar CSS -->
  <link rel="stylesheet" href="/sidebar.css">
  
  <style>
    :root {
      --bg-main: #0a0a0f;
      --bg-panel: rgba(20, 20, 30, 0.6);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #e6e6f0;
      --text-muted: #8b8ba8;
      --border: rgba(255, 255, 255, 0.08);
      --success: #4ade80;
      --error: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
    }

    .main-content {
      padding: 30px 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .header h1 { font-size: 24px; font-weight: 600; margin-bottom: 5px;}
    .header p { color: var(--text-muted); font-size: 14px; margin-bottom: 30px;}

    /* Status Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
    }

    .stat-title { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px;}
    .stat-value { font-size: 24px; font-weight: 700; }
    .stat-value.online { color: var(--success); }
    .stat-value.offline { color: var(--error); }

    /* Action Panel */
    .action-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      backdrop-filter: blur(10px);
    }

    .action-text h3 { font-size: 18px; margin-bottom: 8px;}
    .action-text p { color: var(--text-muted); font-size: 14px; line-height: 1.5;}

    .btn-pair {
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: 0.2s;
      display: inline-block;
      text-align: center;
      width: 100%;
      max-width: 250px;
    }
    .btn-pair:hover { background: var(--primary-hover); transform: translateY(-2px); }

    @media (max-width: 768px) {
      .btn-pair { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Main Content -->
  <div class="main-content">
    
    <div class="header">
      <h1>Welcome back, Presenter</h1>
      <p>Here is the current status of your bot.</p>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">📡 Database Status</div>
        <div class="stat-value online" id="db-status">Checking...</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">🟢 Active Sessions</div>
        <div class="stat-value" id="session-count">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">⏱️ System Uptime</div>
        <div class="stat-value" id="uptime">0s</div>
      </div>
    </div>

    <!-- Action -->
    <div class="action-panel">
      <div class="action-text">
        <h3>Link a new WhatsApp Account</h3>
        <p>Click the button below to go to the pairing panel, enter your phone number, and generate a code.</p>
      </div>
      <a href="/index.html" class="btn-pair">Go to Pairing Panel →</a>
    </div>

  </div>

  <!-- Universal Sidebar JS (Auto-injects the menu and overlay) -->
  <script src="/sidebar.js"></script>

  <!-- Dashboard Logic -->
  <script>
    // Check Status from API
    async function updateStats() {
      try {
        const res = await fetch("/health");
        const data = await res.json();
        
        const dbEl = document.getElementById("db-status");
        dbEl.textContent = data.dbConnected ? "Connected" : "Offline";
        dbEl.className = `stat-value ${data.dbConnected ? "online" : "offline"}`;

        document.getElementById("session-count").textContent = data.activeSessions;
        
      } catch (e) {
        const dbEl = document.getElementById("db-status");
        dbEl.textContent = "Error";
        dbEl.className = "stat-value offline";
      }
    }

    // Uptime Counter
    let seconds = 0;
    setInterval(() => {
      seconds++;
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      document.getElementById("uptime").textContent = `${h}h ${m}m ${s}s`;
    }, 1000);

    updateStats();
    setInterval(updateStats, 5000);
  </script>
</body>
</html>
