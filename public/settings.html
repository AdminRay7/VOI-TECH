<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settings - 303-XMD</title>
  <link rel="stylesheet" href="/sidebar.css">
  <style>
    body { padding-top: 90px !important; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 700px; padding: 20px; }
    .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 30px; backdrop-filter: blur(10px); }
    h2 { margin-top: 0; margin-bottom: 20px; }
    
    .toggle-row { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.05); 
    }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-row span { font-size: 16px; font-weight: 500; }
    
    .switch { position: relative; display: inline-block; width: 54px; height: 30px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #333; transition: .3s; border-radius: 30px; }
    .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
    input:checked + .slider:before { transform: translateX(24px); }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Bot Configuration</h2>
      <p style="color:var(--text-muted); font-size:14px; margin-bottom: 20px;">Enter your linked number to load and edit your settings.</p>
      <input type="text" id="phoneNum" placeholder="e.g. 254712345678" style="margin-bottom: 20px;">
      
      <div id="settingsList" style="display:none;">
        <div class="toggle-row"><span>Auto Read Chats</span><label class="switch"><input type="checkbox" id="autoread"><span class="slider"></span></label></div>
        <div class="toggle-row"><span>Auto View Status</span><label class="switch"><input type="checkbox" id="autoview"><span class="slider"></span></label></div>
        <div class="toggle-row"><span>Auto Like Status</span><label class="switch"><input type="checkbox" id="autolike"><span class="slider"></span></label></div>
        <div class="toggle-row"><span>Anti-Delete</span><label class="switch"><input type="checkbox" id="antidelete"><span class="slider"></span></label></div>
        <div class="toggle-row"><span>Anti-Link (Group)</span><label class="switch"><input type="checkbox" id="antilink"><span class="slider"></span></label></div>
        <div class="toggle-row"><span>Anti-Media (Group)</span><label class="switch"><input type="checkbox" id="antimedia"><span class="slider"></span></label></div>
        
        <button onclick="saveSettings()" style="width:100%; margin-top:30px;">Save Configuration</button>
      </div>
    </div>
  </div>

  <script src="/sidebar.js"></script>
  <script>
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "/login";
    
    const phoneInput = document.getElementById("phoneNum");
    phoneInput.addEventListener("change", async () => {
      const phone = phoneInput.value.replace(/\D/g, "");
      if (phone.length < 10) return;
      
      document.getElementById("settingsList").style.display = "block";
      const res = await fetch(`/api/settings/${phone}`, { headers: { "Authorization": `Bearer ${token}` } });
      const data = await res.json();
      const c = data.commands || {};
      
      document.getElementById("autoread").checked = c.autoread ?? true;
      document.getElementById("autoview").checked = c.autoview ?? true;
      document.getElementById("autolike").checked = c.autolike ?? false;
      document.getElementById("antidelete").checked = c.antidelete ?? true;
      document.getElementById("antilink").checked = c.antilink ?? false;
      document.getElementById("antimedia").checked = c.antimedia ?? false;
    });

    async function saveSettings() {
      const phone = phoneInput.value.replace(/\D/g, "");
      const commands = {
        autoread: document.getElementById("autoread").checked,
        autoview: document.getElementById("autoview").checked,
        autolike: document.getElementById("autolike").checked,
        antidelete: document.getElementById("antidelete").checked,
        antilink: document.getElementById("antilink").checked,
        antimedia: document.getElementById("antimedia").checked
      };
      
      const res = await fetch(`/api/settings/${phone}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ commands })
      });
      
      if (res.ok) alert("Settings Saved Successfully!"); else alert("Failed to save settings.");
    }
  </script>
</body>
</html>
