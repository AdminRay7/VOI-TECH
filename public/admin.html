<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>303-XMD — Admin Panel</title>
  <link rel="stylesheet" href="/sidebar.css">
  <style>
    body { padding-top: 90px !important; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 1000px; padding: 20px; }
    
    .header-area { margin-bottom: 30px; }
    .header-area h1 { font-size: 32px; margin: 0 0 5px 0; color: #ff4757; }
    .header-area p { color: var(--text-muted); }

    /* Stats Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { 
      background: var(--bg-panel); border: 1px solid var(--border); 
      border-radius: 16px; padding: 25px; backdrop-filter: blur(10px); 
      position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
      background: var(--primary); border-radius: 4px 0 0 4px;
    }
    .card.danger::before { background: #ff4757; }
    
    .card-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;}
    .card-value { font-size: 42px; font-weight: 800; margin-bottom: 5px; }
    .card-sub { font-size: 13px; color: var(--text-muted); }
    
    /* Progress Bars */
    .progress-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-top: 15px; overflow: hidden;}
    .progress-fill { height: 100%; background: var(--primary); border-radius: 4px; width: 0%; transition: width 0.5s ease; }
    .progress-fill.danger { background: #ff4757; }

    /* System Terminal Box */
    .terminal-box {
      background: #000; border: 1px solid #222; border-radius: 12px; padding: 20px;
      font-family: monospace; font-size: 14px; color: #4ade80; height: 200px; overflow-y: auto;
    }
    .t-line { margin-bottom: 8px; }
    .t-time { color: var(--text-muted); margin-right: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-area">
      <h1>👑 System Admin</h1>
      <p>Live server monitoring and global controls.</p>
    </div>

    <!-- Live Stats Grid -->
    <div class="grid">
      <div class="card">
        <div class="card-title">🟢 Active Sessions</div>
        <div class="card-value" id="stat-sessions">0</div>
        <div class="card-sub">Devices currently linked</div>
      </div>

      <div class="card danger">
        <div class="card-title">⚡ CPU Usage</div>
        <div class="card-value" id="stat-cpu">0%</div>
        <div class="progress-bg">
          <div class="progress-fill danger" id="cpu-bar"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">💾 Memory Load</div>
        <div class="card-value" id="stat-ram">0%</div>
        <div class="progress-bg">
          <div class="progress-fill" id="ram-bar"></div>
        </div>
      </div>
    </div>

    <!-- System Logs -->
    <h3 style="margin-bottom: 15px; color: #e6e6f0;">📡 Server Activity Log</h3>
    <div class="terminal-box" id="sys-logs">
      <div class="t-line"><span class="t-time">[sys]</span> Initializing admin terminal...</div>
      <div class="t-line"><span class="t-time">[sys]</span> Connected to backend.</div>
    </div>
  </div>

  <script src="/sidebar.js"></script>
  <script>
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    // Kick out non-admins
    if (!token) {
        window.location.href = "/login";
    } else if (role !== "admin") {
        alert("Access Denied: You are not an administrator.");
        window.location.href = "/dashboard";
    } else {
        // Start fetching stats
        fetchAdminStats();
        setInterval(fetchAdminStats, 3000);
        
        // Auto-scroll logs
        const logBox = document.getElementById("sys-logs");
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function fetchAdminStats() {
      try {
        const res = await fetch("/api/admin/stats", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        
        if (!res.ok) throw new Error("Failed to fetch stats");
        const data = await res.json();

        // Update text
        document.getElementById("stat-sessions").textContent = data.totalUsers;
        document.getElementById("stat-cpu").textContent = data.cpuUsage + "%";
        document.getElementById("stat-ram").textContent = data.memoryUsage + "%";

        // Update progress bars
        document.getElementById("cpu-bar").style.width = data.cpuUsage + "%";
        document.getElementById("ram-bar").style.width = data.memoryUsage + "%";

      } catch (e) {
        console.error("Admin stats error:", e);
      }
    }

    // Helper to add logs dynamically
    function addLog(msg) {
      const logBox = document.getElementById("sys-logs");
      const time = new Date().toLocaleTimeString('en-US', { hour12: false });
      logBox.innerHTML += `<div class="t-line"><span class="t-time">[${time}]</span> ${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    // Add a fake log every few seconds to make it look alive
    const logs = [
        "Checking session health...",
        "Cleaning up stale connections...",
        "Pinging MongoDB cluster...",
        "Verifying API tokens...",
        "Session heartbeat successful."
    ];
    setInterval(() => {
        const randomLog = logs[Math.floor(Math.random() * logs.length)];
        addLog(randomLog);
    }, 4500);
  </script>
</body>
</html>
