<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>303-XMD — Pairing Panel</title>
  <link rel="stylesheet" href="/sidebar.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; padding-top: 80px !important; }
    .container { display: flex; gap: 30px; width: 100%; max-width: 1000px; padding: 20px; flex-wrap: wrap; justify-content: center; }
    
    .card {
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: 20px; padding: 40px; width: 100%; max-width: 450px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4); backdrop-filter: blur(12px);
    }
    .card h1 { margin: 0 0 10px; font-size: 28px; }
    .card p { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }
    
    .code-box {
      display: none; text-align: center; margin-top: 25px; padding: 25px;
      background: rgba(99,102,241,0.1); border-radius: 12px; border: 1px dashed var(--primary);
    }
    .code { font-size: 38px; font-weight: 800; letter-spacing: 6px; color: #a5b4fc; margin: 15px 0; font-family: monospace; }
    .copy-btn { background: rgba(255,255,255,0.1); font-size: 14px; padding: 10px 20px; }
    
    .terminal-card { background: #000; border: 1px solid #222; display: flex; flex-direction: column; }
    .term-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 15px; font-family: monospace; }
    .terminal { flex: 1; height: 250px; overflow-y: auto; font-family: monospace; font-size: 13px; color: #4ade80; }
    .log-line { margin-bottom: 8px; }
    .log-time { color: #6366f1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🔑 Pair Device</h1>
      <p>Enter your WhatsApp number to generate a secure pairing code.</p>
      <input type="tel" id="phone" placeholder="e.g. 254712345678" />
      <button id="btn" onclick="pair()" style="width:100%; margin-top: 10px;">Get Pairing Code</button>

      <div class="code-box" id="codeBox">
        <div style="font-size:14px; color:var(--text-muted);">Enter this on your phone:</div>
        <div class="code" id="code"></div>
        <button class="copy-btn" onclick="copyCode()">📋 Copy Code</button>
      </div>
      <div id="status" style="text-align:center; margin-top:20px; font-size:14px;"></div>
    </div>

    <div class="card terminal-card">
      <div class="term-header"><span>[SYSTEM TERMINAL]</span><span id="status-badge">OFFLINE</span></div>
      <div class="terminal" id="terminal">
        <div class="log-line"><span class="log-time">[sys]</span> Waiting for connection...</div>
      </div>
    </div>
  </div>

  <script src="/sidebar.js"></script>
  <script>
    function copyCode() {
      const code = document.getElementById("code").innerText;
      navigator.clipboard.writeText(code);
      alert("Code Copied!");
    }

    async function pair() {
      const phone = document.getElementById("phone").value.replace(/\D/g, "");
      const btn = document.getElementById("btn");
      const status = document.getElementById("status");
      const codeBox = document.getElementById("codeBox");
      
      if (!phone || phone.length < 10) return status.innerHTML = '<span style="color:var(--error)">Enter a valid number.</span>';

      btn.disabled = true; btn.textContent = "Connecting...";
      status.innerHTML = "Requesting code from WhatsApp...";

      try {
        const res = await fetch(`/api/pair?sessionId=${phone}&num=${phone}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        document.getElementById("code").textContent = data.code;
        codeBox.style.display = "block";
        status.innerHTML = "Waiting for you to link...";
        btn.textContent = "Code Generated";
      } catch (err) {
        status.innerHTML = `<span style="color:var(--error)">${err.message}</span>`;
        btn.disabled = false; btn.textContent = "Get Pairing Code";
      }
    }

    async function checkStatus() {
      try {
        const res = await fetch("/health");
        const data = await res.json();
        const badge = document.getElementById("status-badge");
        
        if (data.dbConnected) {
            badge.textContent = "ONLINE"; badge.style.color = "var(--success)";
            const term = document.getElementById("terminal");
            term.innerHTML = `<div class="log-line"><span class="log-time">[sys]</span> MongoDB Connected.</div>
                              <div class="log-line"><span class="log-time">[sys]</span> Active Sessions: ${data.activeSessions}</div>
                              <div class="log-line"><span class="log-time">[sys]</span> Awaiting instructions...</div>`;
        }
      } catch (e) {}
    }
    setInterval(checkStatus, 5000); checkStatus();
  </script>
</body>
</html>
