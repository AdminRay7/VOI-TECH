<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>303-XMD — The Last Key</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #1a1a2e 0%, #0d0d14 60%, #05050a 100%);
      color: #e6e6f0; min-height: 100vh; display: grid; place-items: center;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 40px; width: min(560px, 90vw);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4); backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0.5px; }
    .sub { color: #8b8ba8; margin-bottom: 24px; }
    .row { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px dashed rgba(255,255,255,0.08); }
    .label { color: #9a9ab5; font-size: 14px; }
    .value { font-family: ui-monospace, Menlo, Consolas, monospace; color: #cfd0ff; }
    .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; }
    .on  { background: rgba(0,200,120,0.15); color: #4ade80; }
    .off { background: rgba(220,60,60,0.15);  color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔑 303-XMD</h1>
    <div class="sub">The Last Key — status console</div>

    <div class="row">
      <span class="label">Connected</span>
      <span id="conn" class="pill off">checking…</span>
    </div>
    <div class="row">
      <span class="label">Version</span>
      <span id="ver" class="value">—</span>
    </div>
    <div class="row">
      <span class="label">Uptime</span>
      <span id="up" class="value">—</span>
    </div>
    <div class="row">
      <span class="label">Pairing code</span>
      <span id="pair" class="value">—</span>
    </div>
  </div>

  <script>
    async function refresh() {
      try {
        const r = await fetch("/health");
        const j = await r.json();
        const c = document.getElementById("conn");
        c.textContent = j.connected ? "online" : "offline";
        c.className = "pill " + (j.connected ? "on" : "off");
        document.getElementById("ver").textContent = j.version || "—";
        document.getElementById("up").textContent = Math.floor(j.uptime || 0) + "s";
        document.getElementById("pair").textContent = j.pairing || "—";
      } catch {
        const c = document.getElementById("conn");
        c.textContent = "unreachable";
        c.className = "pill off";
      }
    }
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
