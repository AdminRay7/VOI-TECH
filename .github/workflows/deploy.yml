name: Deploy WhatsApp Bot

on:
  push:
    branches: [ main ] # Ensure your repository's default branch is 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true # Stops the script immediately if any command fails
          script: |
            echo "SSH Connection Successful!"
            echo "Logged in as: $(whoami)"
            
            cd ~/VDI-TECH
            echo "Pulling latest code from GitHub..."
            git pull origin main
            
            echo "Installing dependencies..."
            npm install
            
            echo "Restarting PM2 process..."
            /home/ubuntu/.nvm/versions/node/v26.13.1/bin/pm2 restart index
            
            echo "Deployment complete!"
